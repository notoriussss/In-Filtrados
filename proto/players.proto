syntax = "proto3";
package players.v1;
option go_package = "github.com/notoriussss/in-filtrados/players/gen/playersv1";

service Players {
  rpc Register(RegisterRequest)       returns (Player);
  rpc Login(LoginRequest)             returns (Token);
  rpc ValidateToken(ValidateRequest)  returns (Player);
  rpc GetProfile(PlayerIdRequest)     returns (Profile);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}
message LoginRequest {
  string username = 1;
  string password = 2;
}
message ValidateRequest {
  string token = 1;
}
message PlayerIdRequest {
  string player_id = 1;
}

// Token: devuelto por Login
message Token {
  string token     = 1;
  string player_id = 2;
  string username  = 3;
}
// Player: devuelto por Register y ValidateToken
message Player {
  string player_id = 1;
  string username  = 2;
}
// Profile: devuelto por GetProfile
message Profile {
  string player_id      = 1;
  string username       = 2;
  int32  coins          = 3;
  int32  matches_played = 4;
  int32  wins           = 5;
  // S2-07: estadísticas como impostor.
  int32  times_impostor   = 6;
  int32  wins_as_impostor = 7;
}