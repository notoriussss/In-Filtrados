syntax = "proto3";
package players.v1;
option go_package = "github.com/notoriussss/in-filtrados/players/gen/playersv1";

service Players {
  rpc Register(RegisterRequest)       returns (Player);
  rpc Login(LoginRequest)             returns (Token);
  rpc ValidateToken(ValidateRequest)  returns (Player);
  rpc GetProfile(PlayerIdRequest)     returns (Profile);
  // Tienda: catálogo con lo que ya tiene el jugador, y compras con monedas.
  rpc GetShop(PlayerIdRequest)        returns (Shop);
  rpc BuyItem(BuyItemRequest)         returns (Shop);
  // Ranking: todos los jugadores con sus estadísticas, de más a menos
  // victorias.
  rpc GetRanking(RankingRequest)      returns (Ranking);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}
message LoginRequest {
  string username = 1;
  string password = 2;
}
message ValidateRequest {
  string token = 1;
}
message PlayerIdRequest {
  string player_id = 1;
}

// Token: devuelto por Login
message Token {
  string token     = 1;
  string player_id = 2;
  string username  = 3;
}
// Player: devuelto por Register y ValidateToken
message Player {
  string player_id = 1;
  string username  = 2;
}
// Profile: devuelto por GetProfile
message Profile {
  string player_id      = 1;
  string username       = 2;
  int32  coins          = 3;
  int32  matches_played = 4;
  int32  wins           = 5;
  // S2-07: estadísticas como impostor.
  int32  times_impostor   = 6;
  int32  wins_as_impostor = 7;
}
// BuyItemRequest: comprar un artículo del catálogo con monedas.
message BuyItemRequest {
  string player_id = 1;
  string item_id   = 2;
}
// ShopItem: un artículo del catálogo. kind es "character" (personaje gota,
// id "gota-<color sin #>") o "accessory" (id del accesorio, como "cap").
message ShopItem {
  string id    = 1;
  string kind  = 2;
  int32  price = 3;
  bool   owned = 4;
}
// Shop: monedas del jugador y el catálogo completo (lo suyo marcado).
// Lo devuelven GetShop y BuyItem (ya con la compra hecha).
message Shop {
  int32             coins = 1;
  repeated ShopItem items = 2;
}
// RankingRequest: limit es cuántos jugadores devolver; 0 (o más del
// máximo) devuelve el máximo, 100.
message RankingRequest {
  int32 limit = 1;
}
// RankingEntry: un jugador del ranking. harvest y coins_earned suman todas
// sus partidas (tabla results); las monedas ganadas no bajan al gastar.
message RankingEntry {
  string player_id        = 1;
  string username         = 2;
  int32  matches_played   = 3;
  int32  wins             = 4;
  int32  times_impostor   = 5;
  int32  wins_as_impostor = 6;
  int32  harvest          = 7;
  int32  coins_earned     = 8;
}
// Ranking: lo devuelve GetRanking, ya ordenado (victorias, luego menos
// partidas jugadas, luego nombre).
message Ranking {
  repeated RankingEntry entries = 1;
}
