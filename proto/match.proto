syntax = "proto3";
package match.v1;
option go_package = "github.com/notoriussss/in-filtrados/match/gen/matchv1";

service Match {
  rpc CreateRoom(CreateRoomRequest) returns (Room);
  rpc JoinRoom(JoinRoomRequest) returns (Room);
  rpc Play(stream ClientAction) returns (stream ServerEvent);
}

message CreateRoomRequest {
  string player_id    = 1;
  string display_name = 2;
}
message JoinRoomRequest {
  string room_code    = 1;
  string player_id    = 2;
  string display_name = 3;
}
message Room {
  string room_code = 1;
  string match_id  = 2;
}

message ClientAction {
  oneof action {
    Join join = 1;
    Move move = 2;
    Start start = 3;
    // S2-01: acciones del juego completo.
    Interact    interact    = 4;
    Contaminate contaminate = 5;
    Report      report      = 6;
    Vote        vote        = 7;
    Chat        chat        = 8;
  }
}
message Join {
  string match_id   = 1;
  string player_id  = 2;
  int64  last_tick  = 3;
}
message Move {
  int32 dx = 1;
  int32 dy = 2;
}
// Start: la manda el creador para pasar de LOBBY a PLAYING.
message Start {}

// Interact: hacer una tarea en una estación o limpiar un tanque.
// completed lo manda el navegador al terminar el minijuego (S2-04).
message Interact {
  oneof target {
    string station_id = 1;
    int32  tank_slot  = 3;
  }
  bool completed = 2;
}
// Contaminate: solo el impostor, junto a un tanque (S2-03).
message Contaminate {
  int32 tank_slot = 1;
}
// Report: reportar un tanque muerto; abre la reunión (S2-05).
message Report {
  int32 tank_slot = 1;
}
// Vote: votar por un jugador o saltar el voto (S2-05).
message Vote {
  oneof choice {
    string target_player_id = 1;
    bool   skip             = 2;
  }
}
// Chat: solo en la reunión. client_msg_id evita duplicados al reintentar.
message Chat {
  string client_msg_id = 1;
  string text          = 2;
}

message ServerEvent {
  oneof event {
    Snapshot snapshot = 1;
    Error    error    = 2;
    MatchEnded match_ended = 3;
  }
}
enum Phase {
  LOBBY   = 0;
  PLAYING = 1;
  MEETING = 2;
  ENDED   = 3;
}
enum Role {
  NO_ROLE  = 0; // en LOBBY todavía no hay roles
  CREW     = 1;
  IMPOSTOR = 2;
}
message Snapshot {
  int64              tick    = 1;
  Phase              phase   = 2;
  repeated PlayerView players = 3;
  // S2-01: estado del juego completo.
  repeated TankView tanks     = 4;
  int32             reservoir = 5; // 0 a 100
  // my_role es solo el del destinatario: nunca viaja el rol de otro.
  Role         my_role          = 6;
  TaskProgress my_task_progress = 7;
  Meeting      meeting          = 8; // solo en MEETING
  repeated ChatMessage chat     = 9; // últimos 30 mensajes
  // S2-12: rastro del impostor después de contaminar.
  repeated OilDrop oil_drops    = 10;
  // S3-02: la sala está en pausa mientras alguien está en su periodo de
  // gracia; waiting_for son esos jugadores (docs/deployment-lab.md, 9).
  bool            paused        = 11;
  repeated string waiting_for   = 12;
  // S2-11: las tareas del destinatario (pendientes y hechas) y la
  // estación cuya tarea el servidor dio por iniciada ("" si ninguna).
  // Igual que my_role, nunca viajan las de otro jugador.
  repeated MyTask my_tasks       = 13;
  string          my_active_task = 14;
}
// OilDrop: gota del rastro del impostor tras contaminar (S2-12).
message OilDrop {
  float  x               = 1;
  float  y               = 2;
  string color           = 3;
  int64  expires_at_tick = 4;
}
message TankView {
  int32  slot          = 1;
  string owner_id      = 2;
  int32  contamination = 3; // 0 a 100
  bool   dead          = 4;
}
// MyTask: una estación asignada al jugador y si ya la completó (S2-11).
message MyTask {
  string station_id = 1;
  bool   done       = 2;
}
message TaskProgress {
  int32 completed = 1;
  int32 total     = 2;
}
message Meeting {
  string          reporter_id   = 1;
  int32           tank_slot     = 2;
  repeated string last_visitors = 3; // últimos 3 jugadores distintos
  repeated string votes_cast    = 4; // quién ya votó, nunca por quién
  int64           ends_at_tick  = 5;
  bool            voting_closed = 6; // true durante los 5 s de resultado
  string          ejected_id    = 7; // vacío si nadie salió
  bool            was_impostor  = 8; // solo vale si ejected_id no está vacío
}
message ChatMessage {
  string id        = 1; // client_msg_id
  string player_id = 2;
  string text      = 3;
  int64  tick      = 4;
}
// MatchEnded: fin de la partida. impostor_ids tiene 2 con 7 o más jugadores.
message MatchEnded {
  string          winner       = 1; // "crew" o "impostor"
  repeated string impostor_ids = 2;
}
message PlayerView {
  string id        = 1;
  string name      = 2;
  string color     = 3;
  float  x         = 4;
  float  y         = 5;
  bool   connected = 6;
  bool   alive     = 7;
}
message Error {
  string code    = 1;
  string message = 2;
}