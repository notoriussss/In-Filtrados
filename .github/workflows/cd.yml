name: CD

# Each merge to main publishes one image per service to GitHub Container Registry.
# The lab laptops only run `docker compose pull && docker compose up -d` (docs/deployment-lab.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  publish:
    # Only CI-green commits on main are published.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, gateway, match, players, monitor]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: image
        run: |
          if [ ! -f "${{ matrix.service }}/Dockerfile" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/bajo-la-superficie-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - if: steps.image.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.image.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      # Build context is the repo root for every service, so all of them can read proto/, messages/ and shared/.
      - if: steps.image.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
