name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter reads the PR's changed files through the API; without
# pull-requests: read it fails with "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides which services to check: the folder changed (or a shared contract or this
  # workflow did) and the project already exists. Services not scaffolded yet are skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      match: ${{ steps.exists.outputs.match }}
      players: ${{ steps.exists.outputs.players }}
      node: ${{ steps.exists.outputs.node }}
      monitor: ${{ steps.exists.outputs.monitor }}
      compose: ${{ steps.exists.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts: ['proto/**', 'shared/**', '.github/workflows/ci.yml']
            match: ['match/**']
            players: ['players/**']
            node: ['web/**', 'gateway/**', 'messages/**', 'package.json', 'package-lock.json']
            monitor: ['monitor/**']
      - id: exists
        env:
          CONTRACTS: ${{ steps.filter.outputs.contracts }}
          MATCH: ${{ steps.filter.outputs.match }}
          PLAYERS: ${{ steps.filter.outputs.players }}
          NODE: ${{ steps.filter.outputs.node }}
          MONITOR: ${{ steps.filter.outputs.monitor }}
        run: |
          run() { [ "$1" = true ] && [ -f "$2" ] && echo true || echo false; }
          either() { [ "$1" = true ] || [ "$2" = true ] && echo true || echo false; }
          echo "match=$(run "$(either "$MATCH" "$CONTRACTS")" match/go.mod)" >> "$GITHUB_OUTPUT"
          echo "players=$(run "$(either "$PLAYERS" "$CONTRACTS")" players/Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "node=$(run "$(either "$NODE" "$CONTRACTS")" package.json)" >> "$GITHUB_OUTPUT"
          echo "monitor=$(run "$MONITOR" monitor/pyproject.toml)" >> "$GITHUB_OUTPUT"
          echo "compose=$(run true docker-compose.yml)" >> "$GITHUB_OUTPUT"

  match:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: match
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: match/go.mod
          cache-dependency-path: match/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  players:
    needs: changes
    if: needs.changes.outputs.players == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: players
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: players
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run test --workspaces --if-present
      - run: npm run build --workspaces --if-present

  monitor:
    needs: changes
    if: needs.changes.outputs.monitor == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor/pyproject.toml
      - run: pip install -e .[dev]
      - run: ruff check
      - run: pytest

  # Every image must still build, whatever changed.
  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
