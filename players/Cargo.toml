[package]
name    = "players"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic      = "0.12"
prost      = "0.13"
tokio      = { version = "1", features = ["full"] }
axum       = "0.7"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx       = { version = "0.9", features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
] }
argon2     = "0.6"
uuid       = { version = "1", features = ["v4"] }
chrono     = "0.4"
getrandom  = "0.4"
hex        = "0.4"

[build-dependencies]
tonic-build = "0.12"
