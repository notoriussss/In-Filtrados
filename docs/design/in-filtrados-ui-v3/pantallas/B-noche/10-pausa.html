/* Dirección B · «Consola de riego» (UI/UX Pro Max, estilo Pixel Art):
   interfaz de arcade nocturna. Bordes de píxel con esquinas escalonadas, Press Start 2P para títulos y VT323 para texto,
   medidores en bloques y un cursor ▶ que guía el teclado. */
:root {
  --bg: #06142a; --bg2: #0a1f3a; --pan: #0d2a46; --pan2: #14416a; --pan3: #1a5384;
  --line: #4a9bd0; --line-d: #1c4d75; --ink: #04101f;
  --aqua: #7ee6d8; --water: #3fb2ff; --leaf: #5fe08a; --amber: #ffd24a; --coral: #ff6b6b; --lilac: #b79cff;
  --txt: #e8f8ff; --mut: #9cc3d6; --focus: #ffffff;
  --head: 'Silkscreen', 'Press Start 2P', ui-monospace, monospace; --logo: 'Press Start 2P', ui-monospace, monospace; --body: 'VT323', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
body { font-family: var(--body); font-size: 32px; line-height: 1.3; color: var(--txt); -webkit-font-smoothing: none; font-smooth: never; }
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; overflow: hidden; background: var(--bg); }
canvas { image-rendering: pixelated; display: block; }
.scene { position: absolute; left: 0; top: 0; width: 1920px !important; height: 1080px !important; }
button, input { font: inherit; color: inherit; border-radius: 0; }
h1, h2, h3, p { margin: 0; }
::selection { background: var(--aqua); color: var(--ink); }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 6px; }
.num { font-variant-numeric: tabular-nums; }
.hd { font-family: var(--head); font-weight: 400; line-height: 1.35; text-wrap: balance; }
.mut { color: var(--mut); }
.sm { font-size: 26px; }

/* marco de píxel con esquinas escalonadas */
.panel {
  position: absolute; background: var(--pan); margin: 6px;
  box-shadow: -6px 0 0 0 var(--line), 6px 0 0 0 var(--line), 0 -6px 0 0 var(--line), 0 6px 0 0 var(--line),
    inset 0 6px 0 0 rgba(255, 255, 255, .06), inset 0 -6px 0 0 rgba(0, 0, 0, .25);
  filter: drop-shadow(0 10px 0 rgba(0, 0, 0, .45));
}
.panel.glass { background: rgba(6, 20, 42, .9); }
.panel.deep { background: var(--bg2); box-shadow: -6px 0 0 0 var(--line-d), 6px 0 0 0 var(--line-d), 0 -6px 0 0 var(--line-d), 0 6px 0 0 var(--line-d), inset 0 6px 0 0 rgba(0, 0, 0, .3); }
.ttl { font-family: var(--head); font-size: 29px; line-height: 1.3; color: var(--aqua); display: flex; align-items: center; gap: 16px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 4px dashed var(--line-d); }
.ttl canvas { width: 36px !important; height: 36px !important; }

/* botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 14px; cursor: pointer; margin: 6px; padding: 14px 24px 12px; min-height: 60px;
  font-family: var(--head); font-size: 26px; line-height: 1.2; color: var(--txt); background: var(--pan2); border: 0;
  box-shadow: -6px 0 0 0 var(--line), 6px 0 0 0 var(--line), 0 -6px 0 0 var(--line), 0 6px 0 0 var(--line), inset 0 -6px 0 0 rgba(0, 0, 0, .3);
  transition: transform 80ms steps(2); text-transform: none;
}
.btn:hover { background: var(--pan3); transform: translateY(-4px); }
.btn:active { transform: translateY(4px); box-shadow: -6px 0 0 0 var(--line), 6px 0 0 0 var(--line), 0 -6px 0 0 var(--line), 0 6px 0 0 var(--line), inset 0 6px 0 0 rgba(0, 0, 0, .3); }
.btn.go { background: var(--leaf); color: var(--ink); box-shadow: -6px 0 0 0 #c8ffd9, 6px 0 0 0 #c8ffd9, 0 -6px 0 0 #c8ffd9, 0 6px 0 0 #c8ffd9, inset 0 -6px 0 0 rgba(0, 0, 0, .25); }
.btn.go:hover { background: #86f0a8; }
.btn.warn { background: var(--amber); color: var(--ink); box-shadow: -6px 0 0 0 #fff0a8, 6px 0 0 0 #fff0a8, 0 -6px 0 0 #fff0a8, 0 6px 0 0 #fff0a8, inset 0 -6px 0 0 rgba(0, 0, 0, .25); }
.btn.sm { font-size: 21px; min-height: 48px; padding: 10px 16px 8px; }
.btn canvas { width: 28px !important; height: 28px !important; flex: none; }
.key { display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 8px; font-family: var(--head); font-size: 21px; color: var(--ink); background: var(--txt); box-shadow: 0 5px 0 #6c8da1; }

/* etiquetas y estados */
.tg { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 2px; font-size: 26px; line-height: 1; color: var(--txt); background: var(--bg2); box-shadow: -3px 0 0 0 var(--line-d), 3px 0 0 0 var(--line-d), 0 -3px 0 0 var(--line-d), 0 3px 0 0 var(--line-d); margin: 3px; white-space: nowrap; }
.tg canvas { width: 20px !important; height: 20px !important; }
.tg.ok { background: #0f3b2a; color: var(--leaf); box-shadow: -3px 0 0 0 #2f8a55, 3px 0 0 0 #2f8a55, 0 -3px 0 0 #2f8a55, 0 3px 0 0 #2f8a55; }
.tg.warn { background: #3d3208; color: var(--amber); box-shadow: -3px 0 0 0 #a58a1e, 3px 0 0 0 #a58a1e, 0 -3px 0 0 #a58a1e, 0 3px 0 0 #a58a1e; }
.tg.bad { background: #451818; color: #ff9a9a; box-shadow: -3px 0 0 0 #b34545, 3px 0 0 0 #b34545, 0 -3px 0 0 #b34545, 0 3px 0 0 #b34545; }

/* medidor en bloques */
.bar { position: relative; height: 26px; background: var(--ink); box-shadow: -3px 0 0 0 var(--line-d), 3px 0 0 0 var(--line-d), 0 -3px 0 0 var(--line-d), 0 3px 0 0 var(--line-d); margin: 3px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--v) * 1%); background: repeating-linear-gradient(90deg, var(--c, var(--water)) 0 14px, transparent 14px 18px); }
.bar.leaf { --c: var(--leaf); } .bar.amber { --c: var(--amber); } .bar.bad { --c: var(--coral); }

/* etiqueta de nombre sobre el campo */
.tag { position: absolute; transform: translate(-50%, -100%); padding: 4px 10px 2px; font-size: 26px; line-height: 1; color: var(--txt); background: rgba(4, 16, 31, .88); white-space: nowrap; box-shadow: -3px 0 0 0 #0d2a46, 3px 0 0 0 #0d2a46, 0 -3px 0 0 #0d2a46, 0 3px 0 0 #0d2a46; }
.tag.self { background: var(--aqua); color: var(--ink); }

/* cursor ▶ parpadeante */
@keyframes blink { 50% { opacity: 0; } }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.bob { animation: bob 1.6s steps(4) infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
[hidden] { display: none !important; }

.row { display: flex; align-items: center; }
/* menú principal */
.logo { position: absolute; left: 0; right: 0; top: 70px; text-align: center; }
.logo h1 { font-family: var(--logo); font-weight: 400; font-size: 84px; line-height: 1.2; color: var(--txt); text-shadow: 0 0 0 #000, 6px 6px 0 #0b5a8a, 12px 12px 0 var(--ink); }
.logo h1 span { display: block; color: var(--aqua); }
.logo p { margin-top: 26px; font-size: 44px; color: #cfeeff; text-shadow: 3px 3px 0 var(--ink); }
.menu { left: 660px; top: 470px; width: 600px; padding: 26px 20px; }
.opt { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 10px; width: 100%; padding: 14px 16px 12px; background: transparent; border: 0; cursor: pointer; font-family: var(--head); font-size: 34px; line-height: 1.2; text-align: left; color: var(--txt); }
.opt .ar { visibility: hidden; } .opt .ar canvas { width: 36px !important; height: 36px !important; }
.opt.on, .opt:hover { background: var(--pan3); color: var(--aqua); } .opt.on .ar, .opt:hover .ar { visibility: visible; }
.opt:focus-visible { outline-offset: -4px; }
.hintbar { position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; gap: 36px; font-size: 32px; color: #cfeeff; text-shadow: 3px 3px 0 var(--ink); }
.hintbar span { display: inline-flex; align-items: center; gap: 12px; }
.mas { position: absolute; bottom: 120px; } .mas canvas { filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .35)); }
.ver { position: absolute; right: 36px; bottom: 36px; font-size: 26px; color: #9cc3d6; text-shadow: 2px 2px 0 var(--ink); }
/* elección de personaje */
.top { left: 60px; top: 30px; width: 1800px; height: 100px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; }
.top h2 { font-family: var(--head); font-weight: 400; font-size: 42px; color: var(--aqua); }
.code { font-family: var(--logo); font-size: 26px; padding: 14px 18px 10px; background: var(--ink); color: var(--amber); box-shadow: -4px 0 0 0 var(--amber), 4px 0 0 0 var(--amber), 0 -4px 0 0 var(--amber), 0 4px 0 0 var(--amber); }
.lab { font-family: var(--head); font-size: 21px; color: var(--mut); margin: 4px 0 14px; }
.sws { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 18px; }
.sw { position: relative; aspect-ratio: 1; border: 0; padding: 0; cursor: pointer; box-shadow: -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), inset 6px 6px 0 rgba(255, 255, 255, .45), inset -6px -6px 0 rgba(0, 0, 0, .3); min-width: 0; }
.sw:hover { transform: translateY(-4px); }
.sw[aria-checked='true'] { box-shadow: -6px 0 0 0 #fff, 6px 0 0 0 #fff, 0 -6px 0 0 #fff, 0 6px 0 0 #fff, inset 6px 6px 0 rgba(255, 255, 255, .45), inset -6px -6px 0 rgba(0, 0, 0, .3); }
.sw canvas { position: absolute; inset: 0; margin: auto; width: 36px !important; height: 36px !important; display: none; }
.sw[aria-checked='true'] canvas { display: block; }
.car { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; margin-top: 4px; }
.car .btn { padding: 8px 12px; min-height: 56px; } .car .btn canvas { width: 32px !important; height: 32px !important; }
.car .nm { font-family: var(--head); font-size: 26px; text-align: center; color: var(--txt); }
.dots { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
.dots i { display: block; width: 18px; height: 18px; background: var(--line-d); } .dots i.on { background: var(--aqua); }
.ped { position: relative; display: grid; place-items: center; height: 520px; }
.ped .pl { position: absolute; bottom: 36px; width: 420px; height: 40px; background: var(--pan2); box-shadow: -6px 0 0 0 var(--line), 6px 0 0 0 var(--line), 0 -6px 0 0 var(--line), 0 6px 0 0 var(--line); }
.ped canvas { position: relative; }
.pname { font-family: var(--head); font-size: 29px; text-align: center; margin-top: 8px; color: var(--txt); }
.fld { display: grid; gap: 8px; margin-top: 22px; }
.fld label { font-family: var(--head); font-size: 21px; color: var(--mut); }
.fld input { height: 64px; padding: 0 16px; background: var(--ink); border: 0; font-size: 38px; color: var(--txt); box-shadow: -4px 0 0 0 var(--line), 4px 0 0 0 var(--line), 0 -4px 0 0 var(--line), 0 4px 0 0 var(--line); margin: 4px; }

<script>/* pk-core.js — motor de pixel art procedural (color, sombreado volumétrico, personajes).

    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
