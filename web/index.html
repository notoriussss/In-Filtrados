<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In-Filtrados</title>
  </head>
  <body>
    <div id="screen-login" class="screen" hidden></div>
    <div id="screen-register" class="screen" hidden></div>
    <div id="screen-lobby" class="screen" hidden></div>
    <canvas id="game"></canvas>
    <div id="meeting-overlay" class="overlay" hidden></div>
    <!-- S2-11: lista de misiones y modal del minijuego -->
    <div id="task-list" class="task-list" hidden></div>
    <div id="task-overlay" class="overlay" hidden></div>
    <!-- S2-09: embalse, aviso del tanque y botón de acción contextual -->
    <div id="reservoir" class="reservoir" hidden>
      <div class="reservoir-bar"><div class="reservoir-fill"></div></div>
      <span class="reservoir-label"></span>
    </div>
    <div id="tank-alert" class="tank-alert" hidden></div>
    <!-- S3-05: aviso de emergencia y menú de sabotaje del impostor -->
    <div id="emergency-banner" class="emergency-banner" hidden>
      <strong class="emergency-title"></strong>
      <span class="emergency-hint"></span>
      <span class="emergency-time"></span>
    </div>
    <div id="sabotage-panel" class="sabotage-panel" hidden>
      <h4 class="sabotage-title"></h4>
      <div class="sabotage-buttons"></div>
    </div>
    <button id="action-button" class="action-button" type="button" hidden>
      <span class="action-label"></span>
      <kbd class="action-key"></kbd>
    </button>
    <div id="pause-banner" class="pause-banner" hidden></div>
    <div id="end-overlay" class="overlay overlay-center" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
