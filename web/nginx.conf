server {
    listen 80;
    server_name localhost;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web","checks":{}}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
