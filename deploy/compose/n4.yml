# N4 broker: RabbitMQ con un usuario propio (guest solo entra desde localhost).
# El volumen y el hostname fijo conservan las colas durables entre reinicios.
# docker compose --env-file deploy/lab.env -f deploy/compose/n4.yml up -d
name: in-filtrados-lab

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?falta RABBITMQ_USER en lab.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en lab.env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # Igual que docker-compose.yml: .erlang.cookie con permisos 600 para que
    # arranque en Docker Desktop sobre Windows.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /var/lib/rabbitmq/.erlang.cookie ]; then
          umask 077
          head -c 32 /dev/urandom | base64 > /var/lib/rabbitmq/.erlang.cookie
        fi
        chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie
        chmod 600 /var/lib/rabbitmq/.erlang.cookie
        exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  rabbitmq-data:
